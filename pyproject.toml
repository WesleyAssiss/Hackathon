[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aura"
version = "0.1.0"
description = "Adversarial Unified Reasoning Arena — Liga dos Agentes 2026"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "sse-starlette>=2.1",
    "httpx>=0.27",
    "structlog>=24.4",
    "python-dotenv>=1.0",
    "openai>=1.54",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]
azure = [
    "azure-identity>=1.19",
    "azure-ai-projects>=1.0.0b3",
    "azure-search-documents>=11.5",
    "openai>=1.54",
    "semantic-kernel>=1.16",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "azure-monitor-opentelemetry>=1.6",
]
bot = [
    "discord.py>=2.4",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["aura"]
mypy_path = "backend"
